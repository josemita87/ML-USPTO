[project]
name = "ml-uspto-ipr"
version = "0.1.0"
description = "Predicting IPR institution decisions using USPTO PTAB data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "pdfplumber>=0.11.9",
    "boto3>=1.34",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[project.optional-dependencies]
# Training/evaluation only — not needed by ingestion drivers. The ingestion
# container image builds with `uv sync --no-dev` and skips this group.
ml = [
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = ["ruff", "pytest", "moto[s3]>=5.0"]
infra = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_uspto"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
exclude = '\.venv|\.git|build|dist|cdk\.out'

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pydoclint>=0.8.3",
]
