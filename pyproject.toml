[project]
name = "ml-uspto-ipr"
version = "0.1.0"
description = "Predicting IPR institution decisions using USPTO PTAB data"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pdfplumber>=0.11.9",
]

[project.optional-dependencies]
dev = ["ruff", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_uspto"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
