# Declarative mappings for USPTO PTAB API surfaces.
# Top-level keys correspond to `ml_uspto.parse.schemas.enums.Parser`.
# Inside each surface, `columns` maps an output column name to a dotted
# path into the raw record. Consumed by `ml_uspto.parse.engine.flatten`.

proceedings:
  columns:
    trial_number: trialNumber

    # Trial metadata
    trial_type: trialMetaData.trialTypeCode
    trial_status: trialMetaData.trialStatusCategory
    petition_filing_date: trialMetaData.petitionFilingDate
    accorded_filing_date: trialMetaData.accordedFilingDate
    institution_decision_date: trialMetaData.institutionDecisionDate
    latest_decision_date: trialMetaData.latestDecisionDate
    termination_date: trialMetaData.terminationDate

    # Patent owner data
    patent_number: patentOwnerData.patentNumber
    owner_real_party: patentOwnerData.realPartyInInterestName
    owner_counsel: patentOwnerData.counselName
    grant_date: patentOwnerData.grantDate
    group_art_unit: patentOwnerData.groupArtUnitNumber
    technology_center: patentOwnerData.technologyCenterNumber
    inventor_name: patentOwnerData.inventorName
    application_number: patentOwnerData.applicationNumberText

    # Petitioner data
    petitioner_real_party: regularPetitionerData.realPartyInInterestName
    petitioner_counsel: regularPetitionerData.counselName

decisions:
  columns:
    trial_number: trialNumber

    decision_issue_date: decisionData.decisionIssueDate
    decision_type: decisionData.decisionTypeCategory
    trial_outcome: decisionData.trialOutcomeCategory
    statutes_and_rules: decisionData.statuteAndRuleBag

    document_name: documentData.documentName
    document_title: documentData.documentTitleText
    document_type: documentData.documentTypeDescriptionText
    document_filing_date: documentData.documentFilingDate
    filing_party: documentData.filingPartyCategory

# Documents/search rows. Only `documentData.*` paths are mapped here.
# `trialMetaData.*` is intentionally absent — on a documents row it is the
# trial header denormalized at indexer time and lags the proceedings side
# by minutes-to-months (see docs/api/proceedings.md "What we observed"),
# so any feature pulled from it risks silent post-T₀ contamination. The
# YAML statically enforces the source-of-truth rule from proceedings.md
# §"Field-by-field paths".
documents:
  columns:
    trial_number: trialNumber

    document_number: documentData.documentNumber
    document_title: documentData.documentTitleText
    document_name: documentData.documentName
    document_category: documentData.documentCategory
    document_filing_date: documentData.documentFilingDate
    filing_party: documentData.filingPartyCategory
    file_download_uri: documentData.fileDownloadURI

# Static-only application file-wrapper fields from GET /applications/{appNum}.
# Dated bags (`eventDataBag`, `assignmentBag`, `parentContinuityBag`) are not
# flattened here; `parse.patent_aggregator.aggregate_patent` owns the T0 filter.
# Status-as-of-now fields such as `applicationStatusCode` are intentionally absent.
patents:
  columns:
    application_number: applicationNumberText

    # Bibliographic / static
    filing_date: applicationMetaData.filingDate
    effective_filing_date: applicationMetaData.effectiveFilingDate
    application_type: applicationMetaData.applicationTypeCode
    entity_size: applicationMetaData.entityStatusData.businessEntityStatusCategory
    first_inventor_to_file:
      path: applicationMetaData.firstInventorToFileIndicator
      transform: yn_bool
    national_stage:
      path: applicationMetaData.nationalStageIndicator
      transform: yn_bool
    n_inventors:
      path: applicationMetaData.inventorBag
      transform: count
    inventor_country_codes:
      path: applicationMetaData.inventorBag[].correspondenceAddressBag[].countryCode
      transform: unique_list
    cpc_codes: applicationMetaData.cpcClassificationBag
    uspc_class_subclass: applicationMetaData.uspcSymbolText
    n_attorneys_of_record:
      path: recordAttorney.attorneyBag
      transform: count

    # Patent term adjustment aggregates are frozen at grant.
    pta_a_delay: patentTermAdjustmentData.aDelayQuantity
    pta_b_delay: patentTermAdjustmentData.bDelayQuantity
    pta_c_delay: patentTermAdjustmentData.cDelayQuantity
    pta_total: patentTermAdjustmentData.adjustmentTotalQuantity
    pta_applicant_delay: patentTermAdjustmentData.applicantDayDelayQuantity
