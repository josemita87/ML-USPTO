# Label-construction taxonomies for `ml_uspto.parse.preprocessing`.
# These encode the §3 rules of `docs/scope/prediction_scope.md` as data so the
# code stays stable when USPTO terminology shifts.
#
# Three layers of label resolution, applied in order in `preprocessing.py`:
#   1. status ∈ non_fwd_label_1_statuses → label 1 (no decision lookup needed)
#   2. status ∈ non_fwd_label_0_statuses → label 0 (no decision lookup needed)
#   3. otherwise (FWD-reaching trials) → label depends on the decision-side
#      `trialOutcomeCategory` (see `all_claims_unpatentable_outcomes`).

# trialStatusCategory values that map directly to label 1 without inspecting
# the decision side. Adverse judgment is patent-owner concession (37 CFR
# § 42.73(b)); the practical effect is that the challenged claims are cancelled,
# functionally equivalent to "all claims unpatentable".
# ⚠ Subject to domain-expert review — see `docs/scope/prediction_scope.md` §3.
non_fwd_label_1_statuses:
  - Terminated-Adverse Judgment

# trialStatusCategory values that resolve directly to label 0 without
# inspecting the decision side. Sourced from §3 table in prediction_scope.md
# plus the empirical taxonomy in `docs/api/proceedings.md`.
non_fwd_label_0_statuses:
  - Institution Denied
  - Discretionary Denial
  - Terminated-Settled
  - Terminated  # procedural — joinder, improper filing, etc.
  - Terminated-Dismissed  # procedural

# trialStatusCategory values that mean the trial is still in progress —
# we don't have a terminating outcome yet, so exclude. Empirically the API
# uses `Pending` and `Pending Director Review` for in-flight trials;
# `Trial Instituted` also appears (~351 cases corpus-wide as of 2026-04-24).
pending_statuses:
  - Pending
  - Pending Director Review
  - Trial Instituted

# `documentTypeDescriptionText` markers that identify FWD rows.
# Empirically `decisionTypeCategory` only carries "Decision"/"Rehearing
# Decision" (~18K rows total, 2026-04-29 cold-run), so the FWD marker has
# to come from `documentTypeDescriptionText`. Variants we observed:
#   "Final Written Decision:  original"                   — 2076  (95.2%)
#   "Final Written Decision: On remand from the CAFC"    —   67  ( 3.1%)
#   "Final written decision:  On remand"                  —   17  ( 0.8%)
#   "Final Written Decision:  rehearing"                  —   11  ( 0.5%)
#   "Final Written Decision: on Remand from the Director" —    9  ( 0.4%)
#
# `fwd_decision_type_marker` matches all five (case-insensitive substring).
# `fwd_original_marker` is the strict subset that carries the trial-level
# label per `docs/scope/prediction_scope.md` §3.1 — amendment FWDs
# (on-remand, rehearing) are dropped because their cover-page outcome
# refers to the remanded subset, not the originally-challenged set.
# Substring chosen so both spellings ("Final Written Decision" and
# "Final written decision") pass when followed by the literal "original"
# substring; case-insensitive matching is required for the W vs w drift.
fwd_decision_type_marker: Final Written Decision
fwd_original_marker: original

# trialOutcomeCategory values from the *terminating* FWD that map to label 1.
# ⚠ The API never populates this taxonomy: every IPR FWD returns the bare
# string "Final Written Decision" in `decisionData.trialOutcomeCategory`
# (verified 2026-04-29 cold-run, 0/2,180 FWD rows match any granular
# outcome). The granular outcome lives in `documentData.documentTitleText`
# for ~39% of FWDs and otherwise has to be parsed from the PDF cover
# page — see `fwd_pdf_outcome` below. This list is kept as a sentinel
# for the day USPTO populates the field; until then it never matches.
all_claims_unpatentable_outcomes:
  - All Challenged Claims Unpatentable

# Cover-page regex for parsing the structured `cancelled` label out of an
# *original* FWD PDF. Per `docs/scope/prediction_scope.md` §3.1 we apply
# this only to original FWDs; on-remand and rehearing variants are dropped
# upstream because their cover-page outcome refers to the remanded subset,
# not the originally-challenged set, and produces wrong labels in
# isolation.
#
# Empirically validated against 200 sampled FWD PDFs (2021–2026), of
# which 133 are originals — see `drivers/probe_fwd_pdfs_sample.py`. After
# the originals-only filter, 132/133 (99.2%) resolve to a label; 1
# correctly quarantines (Motion-to-Amend ruling without a "Determining"
# line).
#
# The matcher is a list of (regex, label) patterns evaluated in order;
# first match wins. This shape lets us encode the "Challenged" ambiguity
# in YAML rather than in Python: an unqualified "Challenged Claim(s)
# Unpatentable" means "all challenged claims unpatentable" (label 1),
# while an enumerated "Challenged Claims 1, 3–11, … Unpatentable" means
# only those specific claims (label 0). The two cases are distinguished
# purely by whether digits follow "Claim/Claims" before "Unpatentable".
#
# `cover_page_search_chars` caps the search window so a stray
# "Determining" elsewhere in the body can't override the cover page.
fwd_pdf_outcome:
  cover_page_search_chars: 4000
  patterns:
    # Canonical quantified forms. The word "Challenged" is optional —
    # ~3% of original FWDs in our 200-PDF sample omit it (e.g.,
    # `170536777`, `170979620`, `170182053` write "Determining All Claims
    # Unpatentable"; `170620469` writes "Determining Some Claims
    # Unpatentable"). Together these forms account for >99% of label
    # resolution on originals.
    - name: all_quantified
      regex: 'Determining\s+All\s+(?:Challenged\s+)?Claims?\s+Unpatentable'
      label: 1
    - name: no_quantified
      regex: 'Determining\s+No\s+(?:Challenged\s+)?Claims?\s+Unpatentable'
      label: 0
    - name: some_quantified
      regex: 'Determining\s+Some\s+(?:Challenged\s+)?Claims?\s+Unpatentable'
      label: 0
    # Enumerated subset: "Determining Challenged Claims 1, 3–11, … Unpatentable".
    # By PTAB convention this listing form is only used when the set is a
    # strict subset of the originally-challenged claims (when it's the
    # full set the panel writes "All Challenged Claims" instead). The
    # leading digit pins the discriminator: any character class entry
    # between "Claims" and "Unpatentable" that starts with a number means
    # there's a list, so the unpatentable set is enumerated.
    - name: challenged_enumerated_subset
      regex: 'Determining\s+Challenged\s+Claims?\s+\d[\w\s,\-–]*Unpatentable'
      label: 0
    # Unquantified, no list — implicit "all challenged claims" form.
    # Empirically rare in originals (~0.75% of sample) but real:
    # `170357947` (2023) reads "Determining Challenged Claim Unpatentable".
    # MUST be ordered after the enumerated-subset pattern so a list
    # doesn't fall through to this default.
    - name: challenged_implicit_all
      regex: 'Determining\s+Challenged\s+Claims?\s+Unpatentable'
      label: 1
