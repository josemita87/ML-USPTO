# Label-construction taxonomies for `ml_uspto.parse.labels`.
# These encode the §3 rules of `docs/scope/prediction_scope.md` as data so the
# code stays stable when USPTO terminology shifts.
#
# Three layers of label resolution, applied in order in `labels.py`:
#   1. status ∈ non_fwd_label_1_statuses → label 1 (no decision lookup needed)
#   2. status ∈ non_fwd_label_0_statuses → label 0 (no decision lookup needed)
#   3. otherwise (FWD-reaching trials) → label depends on the decision-side
#      `trialOutcomeCategory` (see `all_claims_unpatentable_outcomes`).

# trialStatusCategory values that map directly to label 1 without inspecting
# the decision side. Adverse judgment is patent-owner concession (37 CFR
# § 42.73(b)); the practical effect is that the challenged claims are cancelled,
# functionally equivalent to "all claims unpatentable".
# ⚠ Subject to domain-expert review — see `docs/scope/prediction_scope.md` §3.
non_fwd_label_1_statuses:
  - Terminated-Adverse Judgment

# trialStatusCategory values that resolve directly to label 0 without
# inspecting the decision side. Sourced from §3 table in prediction_scope.md
# plus the empirical taxonomy in `docs/api/proceedings.md`.
non_fwd_label_0_statuses:
  - Institution Denied
  - Discretionary Denial
  - Terminated-Settled
  - Terminated  # procedural — joinder, improper filing, etc.
  - Terminated-Dismissed  # procedural

# trialStatusCategory values that mean the trial is still in progress —
# we don't have a terminating outcome yet, so exclude. Empirically the API
# uses `Pending` and `Pending Director Review` for in-flight trials;
# `Trial Instituted` also appears (~351 cases corpus-wide as of 2026-04-24).
pending_statuses:
  - Pending
  - Pending Director Review
  - Trial Instituted

# FWD-outcome regex patterns (cover-page + ORDER-section) and their
# search-window caps live in code: `src/ml_uspto/schemas/patterns.py`
# (`FWD_PDF_OUTCOME_PATTERNS`, `LEGACY_FWD_ORDER_PATTERNS`) and
# `src/ml_uspto/schemas/constants.py` (`FWD_PDF_COVER_PAGE_SEARCH_CHARS`,
# `LEGACY_FWD_ORDER_SEARCH_CHARS`). Per project convention regex
# extractors over filed-document text are Python literals, not YAML —
# only the domain-revisable status/doctype taxonomies remain here.

# `documentTypeDescriptionText` values for the trial-terminating
# *original* FWD across the legacy and modern decisions taxonomies.
# Empirical (2026-05-01 cold-run cache, 4,416 FWD-ish rows total):
#   Modern (2018+):
#     "Final Written Decision:  original"                   — 2076
#     "Final Written Decision: On remand from the CAFC"    —   67   (excluded — amendment)
#     "Final written decision:  On remand"                  —   17   (excluded — amendment)
#     "Final Written Decision:  rehearing"                  —   11   (excluded — amendment)
#     "Final Written Decision: on Remand from the Director" —    9   (excluded — amendment)
#   Legacy (2012-2020, single bucket):
#     "Final Decision"                                      — 2340
#
# PTAB renamed the original-FWD bucket from `Final Decision` to
# `Final Written Decision:  original` around 2019-2020. Both forms
# coexist in the cache for ~2018-2020 trials filed during the rename;
# pre-2018 trials are legacy-only. Without the legacy entry below the
# labeler silently drops ~2,300 FWDs and the labeled corpus has zero
# `cancelled=1` examples before 2018 (`docs/scope/prediction_scope.md` §3.1).
#
# Match is case-insensitive after `.strip()`. Amendment FWDs in modern
# data are filtered by document_type alone (the bucket is specific);
# in legacy data the variant lives in the title — see
# `legacy_fwd_amendment_title_markers`.
fwd_original_document_types:
  - "Final Written Decision:  original"
  - "Final Decision"

# Title substrings that flag a legacy-form (`document_type =
# "Final Decision"`) row as an amendment FWD rather than the original.
# Modern equivalents are excluded by document_type alone, so this
# filter only applies to rows in the legacy bucket. Case-insensitive
# substring match against `documentTitleText`.
legacy_fwd_amendment_title_markers:
  - "on remand"
  - "rehearing"
  - "supplemental"
  - "termination decision document"

# trialOutcomeCategory values from the *terminating* FWD that map to label 1.
# ⚠ The API never populates this taxonomy: every IPR FWD returns the bare
# string "Final Written Decision" in `decisionData.trialOutcomeCategory`
# (verified 2026-04-29 cold-run, 0/2,180 FWD rows match any granular
# outcome). The granular outcome lives in `documentData.documentTitleText`
# for ~39% of FWDs and otherwise has to be parsed from the PDF cover
# page (see `src/ml_uspto/schemas/patterns.py::FWD_PDF_OUTCOME_PATTERNS`).
# This list is kept as a sentinel for the day USPTO populates the field;
# until then it never matches.
all_claims_unpatentable_outcomes:
  - All Challenged Claims Unpatentable
