# Layered filter for the petition document among a trial's filings.
# See `src/ml_uspto/parse/petition_picker.py` for the resolution logic and
# `docs/api/proceedings.md` for the category-taxonomy drift this works around.
#
# Title-match and blacklist regexes live in code at
# `src/ml_uspto/parse/schemas/patterns.py` (`PETITION_TITLE`, `BLACKLIST`)
# per project convention — only the domain-tunable thresholds and API
# category taxonomies remain in this file.

# Empirically 94% of real petitions sit at paper 1–3, none observed past
# paper 8 across 239 stratified trials. Drop rows at or above this number.
paper_number_ceiling: 10

# `documentCategory` values to exclude outright. Canonical API casing —
# resolved to `DocumentCategory` enum members at load time.
exhibit_categories:
  - Exhibit
  - Exhibits

# Stage 2 corpus-wide scan filter. Consumed by `ingest.fetch.fetch_petitions`.
# `documentData.documentCategory` values to keep when paginating
# `/trials/documents/search`. PETITION + Paper cover the bulk per
# `docs/api/proceedings.md` "Petition coverage and the category-taxonomy
# drift".
#
# Known excluded: `OTHER`. A 2000-row probe (2026-04-28) found 0 genuine
# petitions in OTHER but 44% of titles contained the word "petition" in
# non-petition contexts (sur-replies, ranking docs, refund requests). A
# tiny slice of recent split-filing trials does file the operative
# `[PUBLIC] Petition for IPR …` under category=OTHER — accepted miss for
# a leakage-sensitive system.
scan_filter:
  document_categories:
    - PETITION
    - Paper
