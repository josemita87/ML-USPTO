# Layered filter for the petition document among a trial's filings.
# See `src/ml_uspto/parse/petition_picker.py` for the resolution logic and
# `docs/api/proceedings.md` for the category-taxonomy drift this works around.

# Title MUST match at least one of these alternatives (case-insensitive).
# Joined with `|` at load time. Bare `\bpetition\b` is intentionally
# permissive — real petition titles take many shapes (`Petition for IPR`,
# `[PUBLIC] Petition for IPR`, `Inter Partes Review Petition of …`,
# `IPR Petition - <party> <patent#>`, `Corrected Petition for IPR`); a
# tighter regex empirically over-rejects. False-positives within the
# PETITION+Paper bucket are caught by `blacklist_alternatives` below
# (Ranking Documents, post-decision petitions, etc.).
title_alternatives:
  - \bpetition\b
  - \binter\s+part(?:e|ie)s\s+review\s+of\b
  - \brequest\s+for\s+(?:inter\s+part(?:e|ie)s\s+review|ipr)\b

# Title MUST NOT match any of these alternatives (case-insensitive).
# The `petitioner['']?s\s+(?!petition\b)` clause uses a negative lookahead so
# "Petitioner's Reply" / "Petitioner's Mandatory Notices" / etc. are rejected
# while "Petitioner's Petition for Inter Partes Review" passes through.
blacklist_alternatives:
  - power of attorney
  - notice of appeal
  - petitioner['’]?s\s+(?!petition\b)
  - notice of (filing date accorded|accord)
  - request for (refund|rehearing)
  - sur-?reply
  - surreply
  - response to petition
  - denying institution
  - institution of inter partes
  - motion for joinder
  - grant of motion for joinder
  - petition for reconsideration
  - petition for rehearing
  - petition for joinder
  # `Petitioner's Petition Ranking and Explanation of Material Differences`
  # is a procedural multi-petition filing (37 CFR §42.108), NOT the
  # operative petition. The `petitioner['s] (?!petition)` clause above
  # doesn't catch it (next word IS `petition`), so we blacklist explicitly.
  - petition ranking

# Empirically 94% of real petitions sit at paper 1–3, none observed past
# paper 8 across 239 stratified trials. Drop rows at or above this number.
paper_number_ceiling: 10

# `documentCategory` values to exclude outright. Canonical API casing —
# resolved to `DocumentCategory` enum members at load time.
exhibit_categories:
  - Exhibit
  - Exhibits

# Stage 2 corpus-wide scan filter. Consumed by `ingest.fetch.fetch_petitions`.
# `documentData.documentCategory` values to keep when paginating
# `/trials/documents/search`. PETITION + Paper cover the bulk per
# `docs/api/proceedings.md` "Petition coverage and the category-taxonomy
# drift".
#
# Known excluded: `OTHER`. A 2000-row probe (2026-04-28) found 0 genuine
# petitions in OTHER but 44% of titles contained the word "petition" in
# non-petition contexts (sur-replies, ranking docs, refund requests). A
# tiny slice of recent split-filing trials does file the operative
# `[PUBLIC] Petition for IPR …` under category=OTHER — those will land
# in `picker_no_match` quarantine, which is the right failure mode for
# a leakage-sensitive system.
scan_filter:
  document_categories:
    - PETITION
    - Paper

# Stage 2 quarantine output. Consumed by `parse.petition_assembler`.
quarantine:
  # How many candidate-row titles to attach to a `picker_no_match` entry to
  # aid manual triage. Five is enough to spot the pattern (corrected
  # petitions, exotic phrasings, etc.) without bloating the parquet.
  sample_titles_limit: 5
