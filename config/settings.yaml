api:
  base_url: "https://api.uspto.gov/api/v1/patent"
  # Set your API key in .env file as USPTO_API_KEY
  page_size: 100
  max_pages: 50  # ~5000 records
  # Burst=1 invariant — USPTO ODP serializes globally, so single-process
  # ingestion inherits serialization for free; never multiprocess this.
  # Sequence is the per-attempt sleep after a 429; ODP requires >=5s.
  backoff_seconds: [5, 10, 20]

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  models_dir: "data/models"

features:
  # Days-based features are computed relative to petition filing date
  date_features: true
  technology_center_encoding: "onehot"
  text_features: false  # Set true to extract basic text stats from petitions (decisions are post-T₀ and excluded — see docs/scope/prediction_scope.md §5.1)

model:
  test_size: 0.2
  random_state: 42
  cv_folds: 5
  mature_days: 600
  experiment_today: "2026-05-05"
  # Frozen at the value used to produce final_submission/report.pdf so that
  # `drivers/run_train.py` reruns reproduce the reported held-out tail (1,907
  # rows, 433 positives). Earlier runs derived this from
  # `experiment_today - mature_days - 600`; the report pinned it explicitly
  # at 2023-01-01 for reproducibility.
  holdout_after: "2023-01-01"
